<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Radicación ICA - Informática y Tributos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .app-container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h1 {
      color: #0056b3;
      text-align: center;
      margin-bottom: 30px;
    }
    hr {
      border: 0;
      height: 1px;
      background: #e0e0e0;
      margin: 40px 0;
    }
    /* Estilos comunes de formulario y tabla */
    .form-container, .table-container {
      margin-bottom: 20px;
    }
    .form-field {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      margin-bottom: 5px;
    }
    input {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      background-color: #0056b3;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    .error {
      color: red;
      font-size: 14px;
      margin-top: 5px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #e0e0e0;
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: #f8f9fa;
    }
    .pendiente { color: #856404; background-color: #fff3cd; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .aprobado { color: #155724; background-color: #d4edda; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
